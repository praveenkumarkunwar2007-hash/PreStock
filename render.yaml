services:
  # PreStock Unified Web Service (Backend API + Interactive Frontend Dashboard)
  - type: web
    name: prestock-app
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
